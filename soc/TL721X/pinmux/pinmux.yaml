pinmux:
  port:
    pa:
      exclude: [adc, lspi, jtag, sws, sdp]
      pins:
        p0:
        p1:
        p2:
        p3:
        p4:
        p5:
        p6:
        p7:
          exclude: all
          include: sws
    pb:
      exclude: [lspi, jtag, sws, sdp]
      pins:
        p0:
        p1:
        p2:
        p3:
        p4:
        p5:
        p6:
        p7:
    pc:
      exclude: [adc, lspi, jtag, sws, sdp]
      pins:
        p0:
        p1:
        p2:
        p3:
        p4:
          include: jtag_tdi
        p5:
          include: jtag_tdo
        p6:
          include: [jtag_tms, sdp_tms]
        p7:
          include: [jtag_tck, sdp_tck]
    pd:
      exclude: [adc, lspi, jtag, sws, sdp]
      pins:
        p0:
          include: [adc]
        p1:
          include: [adc]
        p2:
        p3:
        p4:
        p5:
        p6:
        p7:
    pe:
      exclude: [adc, jtag, sws, sdp]
      pins:
        p0: 
          exclude: all
          include: lspi_chn
        p1:
          exclude: all
          include: lspi_clk
        p2:
          exclude: all
          include: lspi_mosi
        p3:
          exclude: all
          include: lspi_miso
        p4:
          exclude: all
          include: lspi_io2
        p5: 
          exclude: all
          include: lspi_io3
        p5:
          exclude: lspi
        p6:
          exclude: lspi
        p7:
          exclude: lspi
    pf:
      exclude: [adc, lspi, jtag, sws, sdp]
      pins:
        p0:
        p1:
        p2:
        p3:
        p4:
        p5:
        p6:
        p7:

  all:
    shared:
      gpio_output: 0
      gpio_input_pull_none: 0
      gpio_input_pull_down_100k: 0
      gpio_input_pull_up_1m: 0
      gpio_input_pull_up_10k: 0

    unique:
      adc0_in: 0
      adc0_diff: 0

      lspi_chn: 0
      lspi_clk: 0
      lspi_mosi: 0
      lspi_miso: 0
      lspi_io2: 0
      lspi_io3: 0

      jtag_tdi: 0
      jtag_tdo: 0
      jtag_tms: 0
      jtag_tck: 0
      sdp_tms: 0
      sdp_tck: 0

      uart0_rx: 24
      uart0_tx: 23
      uart0_rts: 22
      uart0_cts: 21

      uart1_rx: 28
      uart1_tx: 27
      uart1_rts: 26
      uart1_cts: 25

      uart2_rx: 70
      uart2_tx: 69
      uart2_rts: 68
      uart2_cts: 67

      critical_print_tx: 0
